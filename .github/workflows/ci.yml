name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  # A hand-started run, for the day a push somehow does not start one.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build (packages the apps compile against)
        run: pnpm build

      # One `typecheck` script per package, so the list of what gets checked
      # lives with the packages and not in this file.
      - name: Typecheck
        run: npx turbo run typecheck --concurrency=1

      # `--concurrency=1`, not the default fan-out. Running every package's
      # jest and vitest at once on a two-core runner produced a dozen unrelated
      # suites failing together while each package passed alone -- a red build
      # that says nothing about the code. Sequential costs about a minute here.
      - name: Test
        run: npx turbo run test --concurrency=1

  engine-e2e:
    name: Engine end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Deliberately not `pnpm docker:up`: that also starts `agents`, which
      # waits on `ollama-init` finding qwen3.8:27b (17GB) on a shared ollama
      # daemon that a runner does not have. The engine suite needs none of it.
      # The agents and web suites, which do need the model, are left to a
      # manual or nightly run until there is somewhere to serve it from.
      - name: Bring up the data plane and the engine
        run: |
          node scripts/reset-env-generated.mjs
          docker compose -f docker/docker-compose.yml up -d --wait --build \
            dynamodb-local localstack redis cognito-local seed
          node scripts/wait-for-seed-env.mjs
          docker compose -f docker/docker-compose.yml up -d --wait --build --force-recreate engine

      - name: Engine e2e
        run: pnpm --filter @marketplace/engine test:e2e

      - name: Engine logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs engine --tail 200

      - name: Tear down
        if: always()
        run: pnpm docker:down
